#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "on-request"

default_permissions = "opencrvs"

[permissions.opencrvs]
description = "OpenCRVS infrastructure — workspace write, full network, sensitive infra files blocked"
extends = ":workspace"

[permissions.opencrvs.filesystem]
":minimal" = "read"

[permissions.opencrvs.filesystem.":workspace_roots"]
"." = "write"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/.secrets" = "deny"
"**/.secrets/**" = "deny"
"**/secrets" = "deny"
"**/secrets/**" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/id_rsa" = "deny"
"**/id_ed25519" = "deny"
"**/.ssh" = "deny"
"**/.ssh/**" = "deny"
"**/known_hosts" = "deny"
"**/known_hosts.*" = "deny"
"**/wireguard" = "deny"
"**/wireguard/**" = "deny"
"**/wg*.conf" = "deny"
"**/openvpn" = "deny"
"**/openvpn/**" = "deny"
"**/*.ovpn" = "deny"
"**/vnc" = "deny"
"**/vnc/**" = "deny"
"**/server-setup/inventory/*.yml" = "deny"
"**/server-setup/inventory/*.yaml" = "deny"
"**/inventory/*.yml" = "deny"
"**/inventory/*.yaml" = "deny"
"**/inventory.yml" = "deny"
"**/inventory.yaml" = "deny"
"**/hosts.yml" = "deny"
"**/hosts.yaml" = "deny"
"**/hosts.ini" = "deny"
"**/group_vars" = "deny"
"**/group_vars/**" = "deny"
"**/host_vars" = "deny"
"**/host_vars/**" = "deny"
"**/*.tfstate" = "deny"
"**/*.tfstate.backup" = "deny"
"**/*.tfvars" = "deny"

[permissions.opencrvs.network]
enabled = true

[permissions.opencrvs.network.domains]
"*" = "allow"
