apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerSet
metadata:
  name: opencrvs-ephemeral
  namespace: actions-runner-system
spec:
  replicas: 1
  template:

      repository: opencrvs/infrastructure
      labels:
        - ephemeral
      dockerdWithinRunnerContainer: true
      env:
        - name: RUNNER_DEBUG
          value: "true"
