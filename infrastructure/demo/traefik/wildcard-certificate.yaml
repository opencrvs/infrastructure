apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aws-opencrvs-dev-ssl
  namespace: traefik
spec:
  # Secret names are always required.
  secretName: localhost-cert
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
  dnsNames:
  - "*.aws.opencrvs.dev"
  - "aws.opencrvs.dev"