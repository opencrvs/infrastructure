# All OpenCRVS services will be available under domain:
hostname: opencrvs.localhost

# Access OpenCRVS services at http://opencrvs.localhost
# If SSL is enabled, You need to accept SSL Certificate on localhost for multiple endpoints:
# - login
# - register
# - countryconfig
# - config
# - client
# - ...
# That makes it easier to test the application locally without SSL
# On local environment SSL is disabled by default:
ingress:
  ssl_enabled: false

# On local environment services are exposed at NodePort as well and are available from Tilt
# To access service you need to click on the service name in Tilt UI:
service_type: LoadBalancer

# Horizontal Pod Autoscaler (HPA) configuration:
# Disabled by default for local environment.
hpa:
  enabled: false

# Pod Disruption Budget (PDB) configuration:
# Disabled by default for local environment.
pdb:
  enabled: false

# Define the environment variables for the OpenCRVS services at global level.
env:
  LOG_LEVEL: debug 
  MINIO_BUCKET: "ocrvs"

# OpenCRVS core image tag:
image:
  tag: develop

documents:
  secrets:
    minio-opencrvs-users:
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY

auth:
  secrets:
    redis-opencrvs-users:
      - AUTH_REDIS_PASSWORD:REDIS_PASSWORD
      - AUTH_REDIS_USERNAME:REDIS_USERNAME
    
gateway:
  secrets:
    redis-opencrvs-users:
      - GATEWAY_REDIS_PASSWORD:REDIS_PASSWORD
      - GATEWAY_REDIS_USERNAME:REDIS_USERNAME

countryconfig:
  image:
    # Replace countryconfig with farajaland to test data
    # name: opencrvs/ocrvs-farajaland
    name: opencrvs/ocrvs-countryconfig
    # tag: develop
    # tag: ec53c12
    tag: local

migration:
  secrets:
    minio-opencrvs-users:
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
data_cleanup:
  secrets:
    minio-opencrvs-users:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD

data_seed:
  env:
    SUPER_USER_PASSWORD: "password"
    ACTIVATE_USERS: "true"
  secrets:
    minio-opencrvs-users:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD


webhooks:
  secrets:
    redis-opencrvs-users:
      - WEBHOOKS_REDIS_PASSWORD:REDIS_PASSWORD
      - WEBHOOKS_REDIS_USERNAME:REDIS_USERNAME

workflow:
  secrets:
    redis-opencrvs-users:
      - WORKFLOW_REDIS_PASSWORD:REDIS_PASSWORD
      - WORKFLOW_REDIS_USERNAME:REDIS_USERNAME