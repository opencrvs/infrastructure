chart_dev_mode: true
# All OpenCRVS services will be available under domain:
hostname: opencrvs.localhost

# Access OpenCRVS services at http://opencrvs.localhost
# If SSL is enabled, You need to accept SSL Certificate on localhost for multiple endpoints:
# - login
# - register
# - countryconfig
# - config
# - client
# - ...
# That makes it easier to test the application locally without SSL
# On local environment SSL is disabled by default:
ingress:
  ssl_enabled: false

# On local environment services are exposed at NodePort as well and are available from Tilt
# To access service you need to click on the service name in Tilt UI:
service_type: LoadBalancer

# Horizontal Pod Autoscaler (HPA) configuration:
# Disabled by default for local environment.
hpa:
  enabled: false

# Pod Disruption Budget (PDB) configuration:
# Disabled by default for local environment.
pdb:
  enabled: false

# Define the environment variables for the OpenCRVS services at global level.
env:
  LOG_LEVEL: debug 
  MINIO_BUCKET: "ocrvs"

# By default authentication is disabled on mongodb container
# In secure configuration each container should be authorized separately
mongodb_noauth: false
  
elasticsearch:
  noauth: false

image:
  tag: develop

config:
  secrets:
    mongodb-urls:
      - HEARTH_MONGO_URL
      - CONFIG_MONGO_URL:MONGO_URL
documents:
  secrets:
    minio-opencrvs-users:
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY

auth:
  secrets:
    redis-opencrvs-users:
      - AUTH_REDIS_PASSWORD:REDIS_PASSWORD
      - AUTH_REDIS_USERNAME:REDIS_USERNAME
user_mgnt:
  secrets:
    mongodb-urls:
      - USER_MGNT_MONGO_URL:MONGO_URL
gateway:
  secrets:
    redis-opencrvs-users:
      - GATEWAY_REDIS_PASSWORD:REDIS_PASSWORD
      - GATEWAY_REDIS_USERNAME:REDIS_USERNAME
events:
  secrets:
    elasticsearch-opencrvs-urls:
      - SEARCH_ELASTIC_URL:ES_URL
    mongodb-urls:
      - USER_MGNT_MONGO_URL
      - EVENTS_MONGO_URL
      - EVENTS_MONGO_URL:MONGO_URL
notification:
  secrets:
    mongodb-urls:
      - NOTIFICATION_MONGO_URL:MONGO_URL

dashboards:
  use_default_credentials: false
  secrets:
    mongo-opencrvs-users:
      - PERFORMANCE_MONGODB_USER:OPENCRVS_METABASE_DB_USER
      - PERFORMANCE_MONGODB_DB:OPENCRVS_METABASE_DB_AUTH_DB
      - PERFORMANCE_MONGODB_PASSWORD:OPENCRVS_METABASE_DB_PASS

search:
  secrets:
    mongodb-urls:
      - HEARTH_MONGO_URL
    elasticsearch-opencrvs-urls:
      - SEARCH_ELASTIC_HOST:ES_HOST
countryconfig:
  image:
    # Replace countryconfig with farajaland to test data
    # name: opencrvs/ocrvs-farajaland
    name: opencrvs/ocrvs-countryconfig
    # tag: develop
    # tag: ec53c12
    tag: local
  secrets:
    mongodb-urls:
      - CONFIG_MONGO_URL
      - USER_MGNT_MONGO_URL:MONGO_URL
scheduler:
  secrets:
    mongodb-urls:
      - OPENHIM_MONGO_URL
metrics:
  secrets:
    mongodb-urls:
      - METRICS_MONGO_URL:DASHBOARD_MONGO_URL
      - HEARTH_MONGO_URL
      - METRICS_MONGO_URL:MONGO_URL
migration:
  # env:
    # ES_HOST: "elasticsearch-0.elasticsearch.opencrvs.svc.cluster.local:9200"
  secrets:
    elasticsearch-opencrvs-urls:
      - SEARCH_ELASTIC_HOST:ES_HOST
    minio-opencrvs-users:
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
    mongodb-urls:
      - CONFIG_MONGO_URL:APPLICATION_CONFIG_MONGO_URL
      - USER_MGNT_MONGO_URL
      - PERFORMANCE_MONGO_URL
      - HEARTH_MONGO_URL
      - OPENHIM_MONGO_URL
      - METRICS_MONGO_URL:DASHBOARD_MONGO_URL
      - EVENTS_MONGO_URL
data_cleanup:

  secrets:
    elasticsearch-opencrvs-urls:
      - SEARCH_ELASTIC_HOST:ELASTICSEARCH_HOST
    minio-opencrvs-users:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
    mongodb-admin-user:
      - MONGODB_ADMIN_USER
      - MONGODB_ADMIN_PASSWORD
data_seed:
  env:
    SUPER_USER_PASSWORD: "password"
    ACTIVATE_USERS: "true"
  secrets:
    minio-opencrvs-users:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD


webhooks:
  secrets:
    redis-opencrvs-users:
      - WEBHOOKS_REDIS_PASSWORD:REDIS_PASSWORD
      - WEBHOOKS_REDIS_USERNAME:REDIS_USERNAME
    mongodb-urls:
      - WEBHOOKS_MONGO_URL:MONGO_URL
workflow:
  secrets:
    redis-opencrvs-users:
      - WORKFLOW_REDIS_PASSWORD:REDIS_PASSWORD
      - WORKFLOW_REDIS_USERNAME:REDIS_USERNAME

hearth:
  secrets:
    mongodb-urls:
      - HEARTH_MONGO_URL:mongodb__url