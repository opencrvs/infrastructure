---

- hosts: all
  become: yes
  gather_facts: yes
  ignore_unreachable: false
  become_method: sudo
  tasks:
  - name: Remove /home/${{ inputs.user }}/.google_authenticator
    shell: rm -f /home/${{ inputs.user }}/.google_authenticator
