- name: Ensure .ssh directory exists
  file:
    path: /home/backup/.ssh
    state: directory
    mode: 0700
    owner: backup
    group: backup

- name: Generate an ed25519 SSH keypair for backup user if not present
  openssh_keypair:
    path: "{{ backup_ssh_key_path }}"
    type: ed25519
    owner: backup
    group: backup
    mode: '0600'
    force: false
  register: backup_keypair_result

- name: Add public key to authorized_keys
  ansible.builtin.lineinfile:
    path: /home/backup/.ssh/authorized_keys
    line: "{{ backup_keypair_result.public_key }}"
    create: yes
    owner: backup
    group: backup
    mode: 0600
  when: backup_ssh_key_path is defined

- name: Fetch private key to control/master node
  fetch:
    src: /home/backup/.ssh/id_ed25519
    dest: "/tmp/id_ed25519_backup"
    flat: yes
    mode: '0600'
