# TODO: Make Kubernetes components
- name: Install Helm using get-helm-3 script
  ansible.builtin.shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Install Helm Diff
  become: false
  kubernetes.core.helm_plugin:
    plugin_path: "https://github.com/databus23/helm-diff"
    state: present

- name: Deploy latest version of cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: cert-manager
    chart_repo_url: https://charts.jetstack.io
    release_namespace: cert-manager
    chart_version: v1.18.2
    create_namespace: true
    values:
      crds:
        enabled: true
        keep: true

- name: Deploy actions-runner-controller via Helm
  kubernetes.core.helm:
    name: actions-runner-controller
    chart_ref: actions-runner-controller
    chart_repo_url: https://actions-runner-controller.github.io/actions-runner-controller/
    release_namespace: actions-runner-system
    create_namespace: true
    values:
      githubWebhookServer:
        enabled: false
      authSecret:
        create: true
        github_token: "{{ k8s_runner_token }}"

- name: Create ServiceAccount for opencrvs-runner
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: opencrvs-runner
        namespace: actions-runner-system

- name: Grant cluster-admin to CI runner serviceaccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: opencrvs-runner-admin
      subjects:
        - kind: ServiceAccount
          name: opencrvs-runner
          namespace: actions-runner-system
      roleRef:
        kind: ClusterRole
        name: cluster-admin
        apiGroup: rbac.authorization.k8s.io

- name: Deploy opencrvs-infra-runner
  retries: 5
  delay: 10
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: actions.summerwind.dev/v1alpha1
      kind: RunnerDeployment
      metadata:
        name: opencrvs-infra-runner
        namespace: actions-runner-system
      spec:
        replicas: 1
        template:
          spec:
            serviceAccountName: opencrvs-runner
            repository: "{{ repository }}"
            image: ghcr.io/opencrvs/opencrvs-github-runner:latest
            labels:
              - "self-hosted"
              - "k8s"
              - "{{ k8s_cluster_env }}"
