# make sure your custom changes doesn't conflict with values.yaml
##################################################################################

storage_type: host_path
node_selector:
  role: data1

environment_type: {{environment_type}}

minio:
  use_default_credentials: false
  restore:
    type: {{backup_type}}
  backup:
    type: {{backup_type}}

elasticsearch:
  use_default_credentials: false

mongodb:
  use_default_credentials: false

postgres:
  use_default_credentials: false
  restore:
    type: {{backup_type}}
  backup:
    type: {{backup_type}}

redis:
  auth_mode: acl

monitoring:
  enabled: true

elastalert:
  env:
    HTTP_POST2_ALERT_URL: http://countryconfig.opencrvs-{{env}}.svc.cluster.local:3040/email

# Backup configuration
backup:
  enabled: {{backup_enabled}}
  schedule: "0 1 * * *"
  backup_server_secret: backup-server-ssh-credentials
  backup_server_dir: /home/backup/{{env}}


# Restore configuration
restore:
  enabled: {{restore_enabled}}
  schedule: "0 0 * * *"
  backup_server_secret: backup-server-ssh-credentials
  backup_server_dir: /home/backup/{{restore_environment_name}}
  backup_encryption_secret: restore-encryption-secret