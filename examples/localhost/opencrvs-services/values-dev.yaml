chart_dev_mode: true
# All OpenCRVS services will be available under domain:
hostname: k8s-test.opencrvs.dev

# Access OpenCRVS services at http://k8s-test.opencrvs.dev
# If SSL is enabled, You need to accept SSL Certificate on localhost for multiple endpoints:
# - login
# - register
# - countryconfig
# - config
# - client
# - ...
# That makes it easier to test the application locally without SSL
# On local environment SSL is disabled by default:
ingress:
  tls_resolver: letsencrypt

# On local environment services are exposed at NodePort as well and are available from Tilt
# To access service you need to click on the service name in Tilt UI:
service_type: LoadBalancer

# Horizontal Pod Autoscaler (HPA) configuration:
# Disabled by default for local environment.
hpa:
  enabled: false

# Pod Disruption Budget (PDB) configuration:
# Disabled by default for local environment.
pdb:
  enabled: false

# Define the environment variables for the OpenCRVS services at global level.
env:
  LOG_LEVEL: debug 
  MINIO_BUCKET: "ocrvs"

# OpenCRVS core image tag:
image:
  tag: develop

# FIXME: drop section after testing
config:
  resources:
    memoryRequest: "2Gi"
    cpuRequest: "250m"
    memoryLimit: "2Gi"
    cpuLimit: "2"

countryconfig:
  image:
    # Replace countryconfig with farajaland to test data
    # name: opencrvs/ocrvs-farajaland
    name: opencrvs/ocrvs-countryconfig
    # tag: develop
    # tag: ec53c12
    tag: local
dashboards:
  env:
    OPENCRVS_METABASE_DB_USER: performance
    OPENCRVS_METABASE_DB_PASS: performance