# values.yaml
nameOverride: "local-path"

storageClass:
  create: true
  defaultClass: true
  name: local-path
  reclaimPolicy: Delete

nodeSelector:
  role: data1

configmap:
  config.json: |
    {
      "nodePathMap":[
        {
          "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths":["/data/local-path-provisioner"]
        }
      ]
    }
  setup: |
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      nodeSelector:
        role: data1
      containers:
      - name: helper-pod
        image: busybox
        imagePullPolicy: IfNotPresent
