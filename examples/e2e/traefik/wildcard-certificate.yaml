apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-e2e-opencrvs-dev-ssl
  namespace: traefik
spec:
  # Secret names are always required.
  # TODO: name could be changed to something human friendly
  secretName: localhost-cert
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
  dnsNames:
  - "*.k8s-e2e.opencrvs.dev"
  - "k8s-e2e.opencrvs.dev"
