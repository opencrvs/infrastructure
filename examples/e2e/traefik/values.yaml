# Overwriting https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
namespaceOverride: "traefik"
logs:
  general:
    # "TRACE", "DEBUG", "INFO", "WARN", "ERROR", "FATAL", "PANIC"
    level: "INFO"
    format: "common" # FIXME: json in remote
  access:
    # -- To enable access logs
    enabled: true
ingressRoute:
  dashboard:
    enabled: false
# Be explicit that we only use CRDs, not ingress/gw support
providers: 
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: false
service:
  enabled: true
  single: false
  type: NodePort

ports:
  web:
    port: 8000
    hostPort: 80
    protocol: TCP
    nodePort: 30080
  websecure:
    port: 8443
    nodePort: 30443
    hostPort: 443
    protocol: TCP

certificatesResolvers:
  letsencrypt:
    acme:
      tlsChallenge: false
      httpChallenge:
        entryPoint: web
      email: vadym@opencrvs.org
      storage: /data/acme.json

# Additional arguments
additionalArguments:
  - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
  - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
  - "--certificatesresolvers.letsencrypt.acme.email=vadym@opencrvs.org"
  - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
