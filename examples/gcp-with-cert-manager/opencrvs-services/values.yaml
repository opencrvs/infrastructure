hostname: gcp-poc.opencrvs.dev
elasticsearch:
  auth_mode: auto
  port: 9200
  host: elasticsearch.opencrvs-deps-demo.svc.cluster.local

minio:
  auth_mode: use_secret
  host: minio-0.minio.opencrvs-deps-demo.svc.cluster.local

redis:
  auth_mode: use_secret
  host: redis-0.redis.opencrvs-deps-demo.svc.cluster.local

resources:
  memoryRequest: "512Mi"
  cpuRequest: "200m"
  memoryLimit: "1Gi"
  cpuLimit: "1"

image:
  tag: v2.1.1

dashboards:
  use_default_credentials: false

countryconfig:
  image:
    name: <put your image name here>
    tag: <put your image tag here>

data_seed:
  env:
    ACTIVATE_USERS: "false"
