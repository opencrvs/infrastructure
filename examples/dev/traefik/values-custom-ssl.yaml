# Overwriting https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
namespaceOverride: "traefik"
logs:
  general:
    # "TRACE", "DEBUG", "INFO", "WARN", "ERROR", "FATAL", "PANIC"
    level: "INFO"
    # format: "common" # For local environment
    format: "json" # For server environment
  access:
    # -- To enable access logs
    enabled: true
    format: "json"

ingressRoute:
  dashboard:
    enabled: false

# Be explicit that we only use CRDs, not ingress/gw support
providers: 
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: false

service:
  enabled: true
  single: false
  type: NodePort

ports:
  web:
    port: 8000
    hostPort: 80
    protocol: TCP
    nodePort: 30080
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    port: 8443
    hostPort: 443
    protocol: TCP
    nodePort: 30443

# 👇 Disable ACME
certificatesResolvers: {}

# 👇 Custom TLS configuration
tlsStore:
  default:
    defaultCertificate:
      # Check documentation how to create secret with static SSL certificate
      secretName: traefik-cert


deployment:
  hostNetwork: true

nodeSelector:
  traefik-role: ingress
