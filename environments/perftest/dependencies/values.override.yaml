##################################################################################
# Use this file to customize helm chart behavior
# Please make sure your custom changes doesn't conflict with values.yaml
##################################################################################

utilities:
  image:
    tag: v2.1.0-beta

network_policy:
  ingress_mode: deny
  egress_mode: deny
  allowed_namespaces:
    - opencrvs-perftest

filebeat:
  network_policy:
    egress_mode: full

metricbeat:
  network_policy:
    egress_mode: full
