#========================== Filebeat autodiscover ==============================

# FIXME: Switch to autodiscover
filebeat.autodiscover:
  providers:
    - type: kubernetes
      hints.enabled: true

#================================ Processors ===================================
processors:
  - add_cloud_metadata: ~
  - add_kubernetes_metadata: ~
  - add_locale:
      format: offset
  - add_host_metadata:
      netinfo.enabled: true

  - decode_json_fields:
      fields: ["message", "msg"]
      process_array: false
      max_depth: 1
      target: ""
      overwrite_keys: true
  - script:
      lang: javascript
      id: copy_msg_to_message
      source: >
        function process(event) {
          if (event.Get("msg") !== null) {
            event.Put("message", event.Get("msg"));
          }
        }
#========================== Elasticsearch output ===============================
output.elasticsearch:
  hosts: ['${ELASTICSEARCH_HOST}']
  username: ${ELASTICSEARCH_USERNAME}
  password: ${ELASTICSEARCH_PASSWORD}

#============================== Dashboards =====================================
setup.dashboards:
  enabled: true

#============================== Kibana =========================================
setup.kibana:
  host: '${KIBANA_HOST}'
  username: ${ELASTICSEARCH_USERNAME}
  password: ${ELASTICSEARCH_PASSWORD}

#============================== Xpack Monitoring ===============================
monitoring:
  enabled: true
  elasticsearch:

#============================== Index lifecycle management ===============================
setup.ilm.enabled: true
setup.ilm.policy_name: 'beat-opencrvs-rollover-policy'
setup.ilm.policy_file: /usr/share/filebeat/rollover-policy.json
setup.ilm.check_exists: true
setup.ilm.overwrite: true
