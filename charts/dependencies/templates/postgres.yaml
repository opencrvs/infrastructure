{{ if .Values.postgres.enabled }}
{{- $storageType := default .Values.storage_type .Values.postgres.storage_type | default "pvc" }}
{{- if eq $storageType "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: postgres
  name: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default "1Gi" .Values.postgres.data_storage_size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: postgres
  name: postgres
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: postgres
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
    {{- if .Values.priority_class.enabled }}
      priorityClassName: datastore-high-priority
    {{- end }}
    {{- $node_selector := default .Values.node_selector .Values.postgres.node_selector }}
    {{- if $node_selector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
            {{- range $k, $v := $node_selector }}
              - key: {{ $k }}
                operator: In
                values:
                - {{ $v }}
            {{- end }}
      {{- end }}
      containers: 
        - image: postgres:17
          name: postgres
          env:
          {{- if .Values.postgres.use_default_credentials }}
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: postgres
          {{- else }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.admin_user_secret_name }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.admin_user_secret_name }}
                  key: POSTGRES_PASSWORD
          {{- end }}
          {{- include "render-env-vars" (dict "service_name" "postgres" "Values" .Values) }}
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres
      restartPolicy: Always
      volumes:
        - name: postgres
      {{- if eq $storageType "pvc" }}
          persistentVolumeClaim:
            claimName: postgres
      {{- else if eq $storageType "host_path" }}
          hostPath:
            path: {{ .Values.postgres.host_data_path | default "/data/postgres" }}
            type: DirectoryOrCreate
      {{- end }}

{{- if .Values.backup.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: {{ .Values.postgres.backup_schedule | default .Values.backup.schedule }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:17
              env:
                - name: POSTGRES_HOST
                  value: postgres-0.postgres.{{ .Release.Namespace }}.svc.cluster.local
              {{- if .Values.postgres.use_default_credentials }}
                - name: POSTGRES_USER
                  value: postgres
                - name: PGPASSWORD
                  value: postgres
                - name: POSTGRES_DB
                  value: postgres
              {{- else }}
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.admin_user_secret_name }}
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.admin_user_secret_name }}
                      key: POSTGRES_PASSWORD
              {{- end }}
                - name: ENCRYPT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.backup_encryption_secret }}
                      key: backup_encryption_key
                - name: BACKUP_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.backup_server_secret }}
                      key: user
                - name: BACKUP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.backup_server_secret }}
                      key: host
                - name: BACKUP_REMOTE_DIR
                  value: "{{ .Values.postgres.backup_server_dir | default .Values.backup.backup_server_dir }}"
              command: ["/scripts/backup.sh"]
              volumeMounts:
                - name: backup-ssh-key
                  mountPath: /ssh
                  readOnly: true
                - mountPath: /scripts
                  name: postgres-scripts
          volumes:
            - name: backup-ssh-key
              secret:
                secretName: {{ .Values.backup.backup_server_secret }}
                defaultMode: 0400
                items:
                  - key: ssh_key
                    path: ssh_key
            - name: postgres-scripts
              configMap:
                name: postgres-scripts
                defaultMode: 0755
{{- end }}
{{- if .Values.restore.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-restore
spec:
  schedule: {{ .Values.postgres.restore_schedule | default .Values.restore.schedule }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: restore
              image: postgres:17
              env:
                - name: POSTGRES_HOST
                  value: postgres-0.postgres.{{ .Release.Namespace }}.svc.cluster.local
              {{- if .Values.postgres.use_default_credentials }}
                - name: POSTGRES_USER
                  value: postgres
                - name: PGPASSWORD
                  value: postgres
                - name: POSTGRES_DB
                  value: postgres
              {{- else }}
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.admin_user_secret_name }}
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.admin_user_secret_name }}
                      key: POSTGRES_PASSWORD
              {{- end }}
                - name: ENCRYPT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.restore.backup_encryption_secret }}
                      key: backup_encryption_key
                - name: BACKUP_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.restore.backup_server_secret }}
                      key: user
                - name: BACKUP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.restore.backup_server_secret }}
                      key: host
                - name: BACKUP_REMOTE_DIR
                  value: "{{ .Values.postgres.restore_server_dir | default .Values.restore.backup_server_dir }}"
              command: ["/scripts/restore.sh"]
              volumeMounts:
                - name: backup-ssh-key
                  mountPath: /ssh
                  readOnly: true
                - mountPath: /scripts
                  name: postgres-scripts
          volumes:
            - name: backup-ssh-key
              secret:
                secretName: {{ .Values.restore.backup_server_secret }}
                defaultMode: 0400
                items:
                  - key: ssh_key
                    path: ssh_key
            - name: postgres-scripts
              configMap:
                name: postgres-scripts
                defaultMode: 0755
{{- end }}
{{- end }}
