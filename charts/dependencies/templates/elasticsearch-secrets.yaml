
{{- if not .Values.elasticsearch.use_default_credentials }}
{{/* Prevent secret mutation between helm upgrades */}}
{{- $secret_name := "elasticsearch-opencrvs-users" }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secret_name }}
{{- if not $secret }}
{{- $password := randAlphaNum 32 }}
{{- if $.Values.chart_dev_mode }}
{{- $password = "superadmin" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret_name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  ELASTIC_PASSWORD: {{ $password | b64enc }}
{{- end }}
{{- end }}