{{ if .Values.elasticsearch.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: elasticsearch
  name: elasticsearch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: elasticsearch-backup
  name: elasticsearch-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: elasticsearch
  name: elasticsearch
spec:
  clusterIP: None
  ports:
    - name: '9200'
      port: 9200
      targetPort: 9200
    - name: '9300'
      port: 9300
      targetPort: 9300
  selector:
    app: elasticsearch
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: elasticsearch
  name: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  serviceName: 'elasticsearch'
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
    {{- if .Values.node_selector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
            {{- range $k, $v := .Values.node_selector }}
              - key: {{ $k }}
                operator: In
                values:
                - {{ $v }}
            {{- end }}
      {{- end }}
      initContainers:
        - name: volume-permission-fix
          image: busybox
          command:
            - chown
            - -R
            - "1000:0"  # Change ownership to elasticsearch user and group
            - /usr/share/elasticsearch/data
          volumeMounts:
            - name: elasticsearch
              mountPath: /usr/share/elasticsearch/data
      containers:
        - env:
            - name: ES_JAVA_OPTS
              value: -Xms1024m -Xmx1024m
            - name: cluster.routing.allocation.disk.threshold_enabled
              value: 'false'
            - name: discovery.type
              value: single-node
            - name: path.repo
              value: /data/backups/elasticsearch
          {{- if not .Values.elasticsearch.use_default_credentials }}
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticsearch.admin_user_secret_name }}
                  key: ELASTIC_PASSWORD
            - name: xpack.security.enabled
              value: 'true'
          {{- else }}
            - name: xpack.security.enabled
              value: 'false'
          {{- end }}
          {{- if or .Values.elasticsearch.secrets .Values.elasticsearch.env .Values.env }}
          {{- include "render-env-vars" (dict "service_name" "elasticsearch" "Values" .Values) }}
          {{- end }}
          image: docker.elastic.co/elasticsearch/elasticsearch:8.16.4
          name: elasticsearch
          resources:
            requests:
              memory: "2Gi"     # Memory request is 64 MiB (Optional)
            limits:
              memory: "2Gi"    # Memory limit is 128 MiB
          ports:
            - containerPort: 9200
              protocol: TCP
            - containerPort: 9300
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/share/elasticsearch/data
              name: elasticsearch
            - mountPath: /data/backups/elasticsearch
              name: elasticsearch-backup
      restartPolicy: Always
      volumes:
        - name: elasticsearch
          persistentVolumeClaim:
            claimName: elasticsearch
        - name: elasticsearch-backup
          persistentVolumeClaim:
            claimName: elasticsearch-backup
{{- end }}