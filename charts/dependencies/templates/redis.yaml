apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis
  name: redis
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: redis
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - image: redis:5
        # - image: valkey/valkey:8.1.0-alpine
          name: redis
          {{- if or .Values.redis.secrets .Values.redis.env .Values.env }}
          env:
          {{- include "render-env-vars" (dict "service_name" "redis" "Values" .Values) }}
          {{- end }}
          ports:
            - containerPort: 6379
              protocol: TCP
      restartPolicy: Always
