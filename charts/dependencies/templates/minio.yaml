{{ if .Values.minio.enabled }}
{{- $storageType := default .Values.storage_type .Values.minio.storage_type | default "pvc" }}
{{- if eq $storageType "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: minio
  name: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default "1Gi" .Values.minio.data_storage_size }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-route
spec:
  entryPoints:
  {{- if .Values.ingress.ssl_enabled }}
    - websecure
  {{- end }}
  {{- if or .Values.ingress.tls_resolver (not .Values.ingress.ssl_enabled) }}
    - web
  {{- end }}
  routes:
  - match: 'Host(`minio.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: minio
      namespace: {{ .Release.Namespace }}
      port: 3535
  - match: 'Host(`minio-console.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: minio
      namespace: {{ .Release.Namespace }}
      port: 3536
  {{- if .Values.ingress.tls_resolver }}
  tls:
    certResolver: {{ .Values.ingress.tls_resolver }}
  {{- else if .Values.ingress.tls_secret_name }}
  tls:
    secretName: {{ .Values.ingress.tls_secret_name }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: minio
  name: minio
spec:
  clusterIP: None
  ports:
    - name: '3535'
      port: 3535
      targetPort: 3535
    - name: '3536'
      port: 3536
      targetPort: 3536
  selector:
    app: minio
{{- if .Values.backup.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-backup-cronjobs
data:
  root: |
    {{ .Values.minio.backup_schedule | default .Values.backup.schedule }} /scripts/backup.sh >> /proc/1/fd/1 2>&1
{{- end }}
{{- if .Values.restore.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-restore-cronjobs
data:
  root: |
    {{ .Values.minio.restore_schedule | default .Values.restore.schedule }} /scripts/restore.sh >> /proc/1/fd/1 2>&1
{{- end }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: minio
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  serviceName: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
    {{- if .Values.priority_class.enabled }}
      priorityClassName: {{ .Values.priority_class.name }}
    {{- end }}
    {{- $node_selector := default .Values.node_selector .Values.minio.node_selector }}
    {{- if $node_selector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
            {{- range $k, $v := $node_selector }}
              - key: {{ $k }}
                operator: In
                values:
                - {{ $v }}
            {{- end }}
    {{- end }}
      containers:
        - args:
            - server
            - --address
            - :3535
            - --console-address
            - :3536
            - /data
          image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
          name: minio
          env:
            - name: MINIO_BROWSER_REDIRECT_URL
              value: {{ include "render-external-url" (dict "service_name" "minio-console" "Values" .Values) }}
            - name: MINIO_DOMAIN
              value: {{ include "render-external-url" (dict "service_name" "minio" "Values" .Values) }}
            - name: MINIO_API_CORS_ALLOW_ORIGIN
              value: '*'
          {{- if not .Values.minio.use_default_credentials }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-opencrvs-users
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-opencrvs-users
                  key: MINIO_ROOT_PASSWORD
          {{- end }}
          {{- include "render-env-vars" (dict "service_name" "minio" "Values" .Values) }}
          ports:
            - containerPort: 3535
              protocol: TCP
            - containerPort: 3536
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: minio
    {{- if or .Values.backup.enabled .Values.restore.enabled }}
      initContainers:
      {{- if .Values.backup.enabled }}
        - name: backup
          restartPolicy: Always
          command: ["crond", "-f", "-L", "/var/log/cron.log"]
          image: "bash"
          env:
            - name: BACKUP_MODE
              value: "mirror"
          {{- if not .Values.minio.use_default_credentials }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-opencrvs-users
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-opencrvs-users
                  key: MINIO_ROOT_PASSWORD
          {{- end }}
            - name: ENCRYPT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backup.backup_encryption_secret }}
                  key: backup_encryption_key
            - name: BACKUP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backup.backup_server_secret }}
                  key: user
            - name: BACKUP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backup.backup_server_secret }}
                  key: host
            - name: BACKUP_REMOTE_DIR
              value: "{{ .Values.minio.backup_server_dir | default .Values.backup.backup_server_dir }}"
          volumeMounts:
            - name: backup-ssh-key
              mountPath: /ssh
              readOnly: true
            - mountPath: /data
              name: minio
            - mountPath: /scripts
              name: minio-scripts
            - name: crontab
              mountPath: /etc/crontabs
      {{- end }}
      {{- if .Values.restore.enabled }}
        - name: restore
          restartPolicy: Always
          command: ["crond", "-f", "-L", "/var/log/cron.log"]
          image: "bash"
          env:
            - name: RESTORE_MODE
              value: "mirror"
            - name: RESTORE_DATE
              value: {{ .Values.restore.date }}
          {{- if not .Values.minio.use_default_credentials }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-opencrvs-users
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-opencrvs-users
                  key: MINIO_ROOT_PASSWORD
          {{- end }}
            - name: ENCRYPT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.restore.backup_encryption_secret }}
                  key: backup_encryption_key
            - name: BACKUP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.restore.backup_server_secret }}
                  key: user
            - name: BACKUP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.restore.backup_server_secret }}
                  key: host
            - name: BACKUP_REMOTE_DIR
              value: "{{ .Values.minio.backup_server_dir | default .Values.restore.backup_server_dir }}"
          volumeMounts:
            - name: backup-ssh-key
              mountPath: /ssh
              readOnly: true
            - mountPath: /data
              name: minio
            - mountPath: /scripts
              name: minio-scripts
            - name: crontab
              mountPath: /etc/crontabs
      {{- end }}
    {{- end }}
      restartPolicy: Always
      volumes:
        - name: minio
      {{- if eq $storageType "pvc" }}
          persistentVolumeClaim:
            claimName: minio
      {{- else if eq $storageType "host_path" }}
          hostPath:
            path: {{ .Values.minio.host_data_path | default "/data/minio" }}
            type: DirectoryOrCreate
      {{- end }}
      {{- if .Values.backup.enabled }}
        - name: backup-ssh-key
          secret:
            secretName: {{ .Values.backup.backup_server_secret }}
            defaultMode: 0400
            items:
              - key: ssh_key
                path: ssh_key
        - name: crontab
          configMap:
            name: minio-backup-cronjobs
      {{- end }}
      {{- if .Values.restore.enabled }}
        - name: backup-ssh-key
          secret:
            secretName: {{ .Values.restore.backup_server_secret }}
            defaultMode: 0400
            items:
              - key: ssh_key
                path: ssh_key
        - name: crontab
          configMap:
            name: minio-restore-cronjobs
      {{- end }}
      {{- if or .Values.backup.enabled .Values.restore.enabled }}
        - name: minio-scripts
          configMap:
            name: minio-scripts
            defaultMode: 0755
      {{- end }}
{{- end }}