{{ if .Values.mongodb.enabled }}
{{- $storageType := default .Values.storage_type .Values.mongodb.storage_type | default "pvc" }}
{{- if eq $storageType "pvc" }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: mongodb
  name: mongodb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default "1Gi" .Values.mongodb.data_storage_size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mongodb
  name: mongodb
spec:
  clusterIP: None
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: mongodb
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      priorityClassName: datastore-high-priority
    {{- $node_selector := default .Values.node_selector .Values.mongodb.node_selector }}
    {{- if $node_selector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
            {{- range $k, $v := $node_selector }}
              - key: {{ $k }}
                operator: In
                values:
                - {{ $v }}
            {{- end }}
      {{- end }}
      containers:
        - image: mongo:4.4
          {{- if not .Values.mongodb.use_default_credentials }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.admin_user_secret_name }}
                  key: MONGODB_ADMIN_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.admin_user_secret_name }}
                  key: MONGODB_ADMIN_PASSWORD
          {{- end }}
          name: mongodb
          ports:
            - containerPort: 27017
              protocol: TCP
          volumeMounts:
            - mountPath: /data/db
              name: mongodb-data
      restartPolicy: Always
      volumes:
        - name: mongodb-data
      {{- if eq $storageType "pvc" }}
          persistentVolumeClaim:
            claimName: mongodb
      {{- else if eq $storageType "host_path" }}
          hostPath:
            path: {{ .Values.mongodb.host_data_path | default "/data/mongo" }}
            type: DirectoryOrCreate
      {{- end }}
{{- if .Values.backup.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
spec:
  schedule: {{ .Values.mongodb.backup_schedule | default .Values.backup.schedule }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mongo:4.4
              env:
                - name: MONGODB_HOST
                  value: mongodb-0.mongodb.{{ .Release.Namespace }}.svc.cluster.local:27017
              {{- if not .Values.mongodb.use_default_credentials }}
                - name: MONGODB_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.mongodb.admin_user_secret_name }}
                      key: MONGODB_ADMIN_USER
                - name: MONGODB_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.mongodb.admin_user_secret_name }}
                      key: MONGODB_ADMIN_PASSWORD
              {{- end }}
                - name: ENCRYPT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.backup_encryption_secret }}
                      key: backup_encryption_key
                - name: BACKUP_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.backup_server_secret }}
                      key: user
                - name: BACKUP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.backup_server_secret }}
                      key: host
                - name: BACKUP_REMOTE_DIR
                  value: "{{ .Values.mongodb.backup_server_dir | default .Values.backup.backup_server_dir }}"
              command: ["/scripts/backup.sh"]
              volumeMounts:
                - name: backup-ssh-key
                  mountPath: /ssh
                  readOnly: true
                - mountPath: /scripts
                  name: mongodb-scripts
          volumes:
            - name: backup-ssh-key
              secret:
                secretName: {{ .Values.backup.backup_server_secret }}
                defaultMode: 0400
                items:
                  - key: ssh_key
                    path: ssh_key
            - name: mongodb-scripts
              configMap:
                name: mongodb-scripts
                defaultMode: 0755
{{- end }}
{{- if .Values.restore.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-restore
spec:
  schedule: {{ .Values.restore.backup_schedule | default .Values.restore.schedule }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mongo:4.4
              env:
                - name: MONGODB_HOST
                  value: mongodb-0.mongodb.{{ .Release.Namespace }}.svc.cluster.local:27017
              {{- if not .Values.mongodb.use_default_credentials }}
                - name: MONGODB_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.mongodb.admin_user_secret_name }}
                      key: MONGODB_ADMIN_USER
                - name: MONGODB_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.mongodb.admin_user_secret_name }}
                      key: MONGODB_ADMIN_PASSWORD
              {{- end }}
                - name: ENCRYPT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.restore.backup_encryption_secret }}
                      key: backup_encryption_key
                - name: BACKUP_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.restore.backup_server_secret }}
                      key: user
                - name: BACKUP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.restore.backup_server_secret }}
                      key: host
                - name: BACKUP_REMOTE_DIR
                  value: "{{ .Values.mongodb.restore_server_dir | default .Values.restore.backup_server_dir }}"
              command: ["/scripts/restore.sh"]
              volumeMounts:
                - name: backup-ssh-key
                  mountPath: /ssh
                  readOnly: true
                - mountPath: /scripts
                  name: mongodb-scripts
          volumes:
            - name: backup-ssh-key
              secret:
                secretName: {{ .Values.restore.backup_server_secret }}
                defaultMode: 0400
                items:
                  - key: ssh_key
                    path: ssh_key
            - name: mongodb-scripts
              configMap:
                name: mongodb-scripts
                defaultMode: 0755
{{- end }}
{{- end }}