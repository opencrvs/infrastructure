# NOTES:
# Liveness and readiness probes defaults are here:
# We are good to go with defaults for now
# https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#configure-probes


###############################################################################
# Dependencies configuration
###############################################################################
# Please update values.yaml for your particular environment with correct values
# Default values for dependencies are configured with considerations:
# - All dependencies are deployed by dependencies helm chart
# - Dependencies are deployed in opencrvs-deps-dev namespace


# Elasticsearch configuration, including the hostname and port.
# TODO: Consider defining the port as a separate variable.
elasticsearch_host: elasticsearch.opencrvs-deps-dev.svc.cluster.local:9200

# InfluxDB configuration, including the hostname, port, and database name.
influxdb:
  host: influxdb-0.influxdb.opencrvs-deps-dev.svc.cluster.local
  port: 8086
  db: ocrvs

# FHIR URL Endpoint.
fhir_url: http://hearth.opencrvs-deps-dev.svc.cluster.local:3447/fhir

# MinIO configuration, including the hostname and port.
minio:
  host: minio-0.minio.opencrvs-deps-dev.svc.cluster.local
  port: "3535"

redis_host: redis-0.redis.opencrvs-deps-dev.svc.cluster.local
# MongoDB hostname configuration.
mongodb_host: mongodb-0.mongodb.opencrvs-deps-dev.svc.cluster.local

###############################################################################
# Application configuration
###############################################################################

# Hostname for OpenCRVS application, without wildcard or subdomain.
# All OpenCRVS services will be available under domain:
hostname: farajaland.org

# Access OpenCRVS services at https://<hostname>/
# For example, https://farajaland.org/
ingress:
  ssl_enabled: true

# See kubernetes documentation for more information on service types:
# https://kubernetes.io/docs/concepts/services-networking/service/
service_type: ClusterIP

# Horizontal Pod Autoscaler (HPA) configuration:
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  averageUtilization: 75

# Pod Disruption Budget (PDB) configuration:
pdb:
  enabled: true
  minAvailable: 50%

# Resources allocated to OpenCRVS microservices (Kubernetes PODs):
resources:
  memoryRequest: "256Mi"
  cpuRequest: "250m"
  memoryLimit: "1Gi"
  cpuLimit: "500m"

# Global environment variables applied to
# all OpenCRVS microservices (Kubernetes PODs):
env:
  QA_ENV: true
  NODE_ENV: production
  # LOG_LEVEL: debug
  # Application performance monitoring service URL.
  # APN_SERVICE_URL: http://dependencies_apm-server:8200

  # Sentry DSN (Data Source Name) configuration for error tracking.
  # Note: The SENTRY_DSN should be defined at the global level of environment variables.
  # SENTRY_DSN: https://...@o309867.ingest.sentry.io/....

# OpenCRVS core image tag:
image:
  tag: develop

# Per service configuration:
auth:
  replicas: 1
  port: 4040
  hpa:
    maxReplicas: 10

client:
  replicas: 1
  port: 3000
  container_port: 80
  env:
    DECLARED_DECLARATION_SEARCH_QUERY_COUNT: 100

# `config` Microservice configuration example:
config:
  replicas: 1
  port: 2021
  hpa:
    minReplicas: 1
    maxReplicas: 1
  # Service level environment variables
  env:
    DOMAIN: "*"
    CHECK_INVALID_TOKEN: true
  # Mapping for external secrets goes here:
  # README.md for more details
  secrets: {}

countryconfig:
  image:
    # Replace this repository with your own image
    name: opencrvs/ocrvs-countryconfig
    tag: develop
  replicas: 1
  port: 3040
  env:
    ALERT_EMAIL: kibana-alerts-aaaafy3oysoklmlsqcjxad7rfi@opencrvsworkspace.slack.com
    CHECK_INVALID_TOKEN: true

    # INFOBIP_API_KEY: ""
    # INFOBIP_GATEWAY_ENDPOINT: ""
    # INFOBIP_SENDER_ID: ""

    NOTIFICATION_TRANSPORT: email

    SENDER_EMAIL_ADDRESS: noreply@opencrvs.org
    SMTP_HOST: localhost
    SMTP_PASSWORD: ""
    SMTP_PORT: 587
    SMTP_SECURE: "false"
    SMTP_USERNAME: apikey
dashboards:
  replicas: 1
  port: 4444
  hpa:
    minReplicas: 1
    maxReplicas: 1
  env:
    OPENCRVS_METABASE_ADMIN_EMAIL: ""
    OPENCRVS_METABASE_ADMIN_PASSWORD: ""
    OPENCRVS_METABASE_DB_AUTH_DB: ""
    OPENCRVS_METABASE_DB_PASS: ""
    OPENCRVS_METABASE_DB_USER: ""
    OPENCRVS_METABASE_MAP_NAME: Full country
    OPENCRVS_METABASE_MAP_REGION_KEY: State
    OPENCRVS_METABASE_MAP_REGION_NAME: State
    OPENCRVS_METABASE_SITE_NAME: OpenCRVS Dashboards
    OPENCRVS_METABASE_ADMIN_EMAIL: user@opencrvs.org
    OPENCRVS_METABASE_ADMIN_PASSWORD: m3tabase
  resources:
    memoryRequest: "512Mi"
    cpuRequest: "250m"
    memoryLimit: "1Gi"
    cpuLimit: "500m"

data_seeder:
  enabled: false
  env:
    SUPER_USER_PASSWORD: "password"
    ACTIVATE_USERS: "true"


documents:
  replicas: 1
  port: 9050

gateway:
  replicas: 1
  port: 7070
  env:
    CHECK_INVALID_TOKEN: "true"
    CONFIG_SMS_CODE_EXPIRY_SECONDS: "600"
    CONFIG_TOKEN_EXPIRY_SECONDS: "604800"
    MINIO_BUCKET: "ocrvs"
    COUNTRY: FAR
    DISABLE_RATE_LIMIT: "true"
    DOMAIN: "opencrvs.localhost"
    LANGUAGES: "en,fr"

login:
  replicas: 1
  port: 3020
  container_port: 80

metrics:
  replicas: 1
  port: 1050

notification:
  env:
    COUNTRY: bgd
  replicas: 1
  port: 2020

search:
  replicas: 1
  port: 9090

user_mgnt:
  replicas: 1
  port: 3030
  

webhooks:
  replicas: 1
  port: 2525

workflow:
  replicas: 1
  port: 5050

events:
  replicas: 1
  port: 5555

scheduler: {}

# One Time Jobs configuration:
data_cleanup:
  # TODO: Add more restrictive flag to avoid someone running this job by mistake
  enabled: false

data_migration:
  enabled: false
  env:
    SUPER_USER_PASSWORD: "password"

data_seeder:
  enabled: false
  env:
    SUPER_USER_PASSWORD: "password"
    ACTIVATE_USERS: "true"

# TODO: Implement this job
data_backup:
  enabled: false
  schedule: "0 0 * * *"

# TODO: Implement this job
data_restore:
  enabled: false
  schedule: "0 0 * * *"
