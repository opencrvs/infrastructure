---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: countryconfig-route
spec:
  entryPoints:
  {{- if .Values.ingress.ssl_enabled }}
    - websecure
  {{- else }}
    - web
  {{- end }}
  routes:
  - match: 'Host(`countryconfig.{{ .Values.hostname }}`) && !Path(`/email`) && !Path(`/notification`) && !Path(`/dashboards/queries.json`)'
    kind: Rule
    services:
    - name: countryconfig
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.countryconfig.port }}
    middlewares:
      - name: sts-and-basic-response-headers
      - name: enable-compression
  - match: 'Host(`countryconfig.{{ .Values.hostname }}`) && Path(`/email`)'
    kind: Rule
    services:
    - name: countryconfig
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.countryconfig.port }}
    middlewares:
      - name: block-internal-routes
  - match: 'Host(`countryconfig.{{ .Values.hostname }}`) && Path(`/notification`)'
    kind: Rule
    services:
    - name: countryconfig
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.countryconfig.port }}
    middlewares:
      - name: block-internal-routes
  - match: 'Host(`countryconfig.{{ .Values.hostname }}`) && Path(`/dashboards/queries.json`)'
    kind: Rule
    services:
    - name: countryconfig
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.countryconfig.port }}
    middlewares:
      - name: block-internal-routes

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: countryconfig
  name: countryconfig
spec:
  replicas: {{ .Values.countryconfig.replicas }}
  selector:
    matchLabels:
      app: countryconfig
  template:
    metadata:
      labels:
        app: countryconfig
    spec:
      containers:
        - name: countryconfig
          image: "{{ .Values.countryconfig.image.name }}:{{ .Values.countryconfig.image.tag }}"
          env:
            - name: CERT_PUBLIC_KEY_PATH
              value: /secrets/public-key.pem
            - name: COUNTRY_CONFIG_HOST
              value: "0.0.0.0"
            - name: FHIR_URL
              value: {{ .Values.fhir_url | quote }}
            - name: CLIENT_APP_URL
              value: {{ include "render-external-url" (dict "service_name" "register" "Values" .Values) }}
            - name: LOGIN_URL
              value: {{ include "render-external-url" (dict "service_name" "login" "Values" .Values) }}
            # TODO: Check if this value is needed here?
            - name: COUNTRY_CONFIG_URL
              value: {{ include "render-external-url" (dict "service_name" "countryconfig" "Values" .Values) }}
            - name: DOMAIN
              value: {{ .Values.hostname | quote }}
            - name: GATEWAY_URL
              value: "http://gateway.{{ .Release.Namespace }}.svc.cluster.local:7070"
            - name: APPLICATION_CONFIG_URL
              value: "http://config.{{ .Release.Namespace }}.svc.cluster.local:2021"
            - name: AUTH_URL
              value: "http://auth.{{ .Release.Namespace }}.svc.cluster.local:4040"
            - name: CONFIRM_REGISTRATION_URL
              value: http://workflow.{{ .Release.Namespace }}.svc.cluster.local:5050/confirm/registration
          {{- if .Values.mongodb_noauth }}
            - name: CONFIG_MONGO_URL
              value: mongodb://{{ .Values.mongodb_host }}/application-config
            - name: MONGO_URL
              value: mongodb://{{ .Values.mongodb_host }}/user-
          {{- end }}
          {{- include "render-env-vars" (dict "service_name" "countryconfig" "Values" .Values) }}
          {{ include "resources-helper" (dict "service_name" "countryconfig" "Values" .Values) | indent 10 }}
          ports:
            - containerPort: {{ .Values.countryconfig.port }}
              protocol: TCP
          # TODO: Implement liveness and readiness probes
          volumeMounts:
            - mountPath: /secrets/public-key.pem
              name: public-key
              subPath: public-key.pem
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: public-key.pem
                path: public-key.pem
            name: {{ .Release.Name }}-cert-tls
          name: public-key

{{- include "service-helper" (dict "service_name" "countryconfig" "Values" .Values) }}

{{- include "hpa-helper" (dict "service_name" "countryconfig" "Values" .Values) }}

{{- include "pdb-helper" (dict "service_name" "countryconfig" "Values" .Values) }}
