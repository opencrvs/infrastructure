
{{- if or (eq .Values.postgres.auth_mode "auto") (eq .Values.postgres.auth_mode "disabled") }}
{{/* Prevent secret mutation between helm upgrades */}}

{{- $secret := lookup "v1" "Secret" .Release.Namespace .Values.postgres.users_secret }}
{{- if not $secret }}

{{- $passwords := dict }}
{{- $postgres_db_urls := dict }}


{{- $EVENTS_APP_POSTGRES_PASSWORD := randAlphaNum 32 }}
{{- $EVENTS_MIGRATOR_POSTGRES_PASSWORD := randAlphaNum 32 }}
{{- if or ($.Values.chart_dev_mode) (eq .Values.postgres.auth_mode "disabled") }}
  {{- $EVENTS_APP_POSTGRES_PASSWORD = "password" }}
  {{- $EVENTS_MIGRATOR_POSTGRES_PASSWORD = "password" }}
{{- end }}
{{- $_ := set $passwords "EVENTS_APP_POSTGRES_PASSWORD" $EVENTS_APP_POSTGRES_PASSWORD }}
{{- $_ := set $passwords "EVENTS_MIGRATOR_POSTGRES_PASSWORD" $EVENTS_MIGRATOR_POSTGRES_PASSWORD }}

{{- $_ := set $postgres_db_urls "events_app_db_url" (printf "postgres://events_app:%s@%s:5432/events" $EVENTS_APP_POSTGRES_PASSWORD $.Values.postgres.host) }}
{{- $_ := set $postgres_db_urls "events_migrator_db_url" (printf "postgres://events_migrator:%s@%s:5432/events" $EVENTS_MIGRATOR_POSTGRES_PASSWORD $.Values.postgres.host) }}

{{/*
Postgres regular users (per database)
Secret is used to create users and assign appropriate roles
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.users_secret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  {{- range $key, $val := $passwords }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.urls_secret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  {{- range $key, $val := $postgres_db_urls }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end }}

{{- end }}
{{- end }}
