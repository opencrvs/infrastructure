apiVersion: v1
kind: Service
metadata:
  labels:
    app: auth
  name: auth
spec:
  ports:
    - port: 4040
      targetPort: 4040
  selector:
    app: auth
  type: {{ .Values.service_type }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-route
spec:
  entryPoints:
    - websecure
  routes:
  - match: 'Host(`auth.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: auth
      namespace: {{ .Release.Namespace }}
      port: 4040
    middlewares:
      - name: sts-and-basic-response-headers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth
  name: auth
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - image: "ghcr.io/opencrvs/ocrvs-auth:{{ .Values.image.tag }}"
          name: auth
          env:
            - name: REDIS_HOST
              value: {{ .Values.redis_host | quote }}
            - name: COUNTRY_CONFIG_URL
              value: "https://countryconfig.{{ .Values.hostname }}"
            - name: CLIENT_APP_URL
              value: "https://register.{{ .Values.hostname }}"
            - name: LOGIN_URL
              value: "https://login.{{ .Values.hostname }}"
            - name: CERT_PRIVATE_KEY_PATH
              value: /secrets/private-key.pem
            - name: CERT_PUBLIC_KEY_PATH
              value: /secrets/public-key.pem
            - name: CONFIG_SMS_CODE_EXPIRY_SECONDS
              value: '600'
            - name: CONFIG_TOKEN_EXPIRY_SECONDS
              value: '604800'
            - name: METRICS_URL
              value: http://metrics.{{ .Release.Namespace }}.svc.cluster.local:1050
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification.{{ .Release.Namespace }}.svc.cluster.local:2020/
            - name: USER_MANAGEMENT_URL
              value: http://user-mgnt.{{ .Release.Namespace }}.svc.cluster.local:3030/
            - name: AUTH_PORT
              value: "4040"
            - name: COUNTRY_CONFIG_URL_INTERNAL
              value: http://countryconfig.{{ .Release.Namespace }}.svc.cluster.local:3040
            - name: DOMAIN
              value: {{ .Values.hostname | quote }}
          {{- include "render-env-vars" (dict "service_name" "auth" "Values" .Values) }}
          ports:
            - containerPort: 4040
              protocol: TCP
          volumeMounts:
            - mountPath: /secrets/public-key.pem
              name: public-key
              subPath: public-key.pem
            - mountPath: /secrets/private-key.pem
              name: private-key
              subPath: private-key.pem
          readinessProbe:
            httpGet:
              path: /ping # FIXME: not real healthz, just checking if http server is up
              port: 4040
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: public-key.pem
                path: public-key.pem
            name: public-key
          name: public-key
        - secret:
            secretName: private-key
          name: private-key
