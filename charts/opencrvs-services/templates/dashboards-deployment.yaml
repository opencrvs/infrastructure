apiVersion: v1
kind: Service
metadata:
  labels:
    app: dashboards
  name: dashboards
spec:
  ports:
    - port: 4444
      targetPort: 4444
  selector:
    app: config
  type: LoadBalancer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboards-route
spec:
  entryPoints:
    - websecure
  routes:
  - match: 'Host(`metabase.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: dashboards
      namespace: {{ .Release.Namespace }}
      port: 4444
    middlewares:
      - name: sts-and-basic-response-headers
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dashboards
  name: dashboards
spec:
  replicas: {{ .Values.dashboards.replicas }}
  selector:
    matchLabels:
      app: dashboards
  template:
    metadata:
      labels:
        app: dashboards
    spec:
      containers:
        - name: dashboards
          image: "ghcr.io/opencrvs/ocrvs-dashboards:{{ .Values.image.tag }}"
          env:
            - name: OPENCRVS_METABASE_SITE_URL
              value: "http://metabase.{{ .Values.hostname }}"
            - name: OPENCRVS_METABASE_MAP_URL
              value: "http://countryconfig.{{ .Release.Namespace }}.svc.cluster.local:3040/content/map.geojson"
            - name: OPENCRVS_METABASE_DB_HOST
              value: {{ .Values.mongodb.mongodb_host | quote }}
          {{- range $k, $v := .Values.dashboards.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
      restartPolicy: Always
