apiVersion: v1
kind: Service
metadata:
  labels:
    app: gateway
  name: gateway
spec:
  ports:
    - port: 7070
      targetPort: 7070
  selector:
    app: gateway
  type: {{ .Values.service_type }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gateway-route
spec:
  entryPoints:
    - websecure
  routes:
  - match: 'Host(`gateway.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: gateway
      namespace: {{ .Release.Namespace }}
      port: 7070
    middlewares:
      - name: sts-and-basic-response-headers
      # - name: enable-compression
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gateway
  name: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "ghcr.io/opencrvs/ocrvs-gateway:{{ .Values.image.tag }}"
          env:
            - name: CERT_PUBLIC_KEY_PATH
              value: /secrets/public-key.pem
            - name: HOST
              value: "0.0.0.0"
            - name: FHIR_URL
              value: {{ .Values.fhir_url | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis_host | quote }}
            - name: CLIENT_APP_URL
              value: "https://register.{{ .Values.hostname }}"
            - name: LOGIN_URL
              value: "https://login.{{ .Values.hostname }}"
            - name: APPLICATION_CONFIG_URL
              value: "http://config.{{ .Release.Namespace }}.svc.cluster.local:2021"
            - name: AUTH_URL
              value: http://auth.{{ .Release.Namespace }}.svc.cluster.local:4040
            - name: DOCUMENTS_URL
              value: "http://documents.{{ .Release.Namespace }}.svc.cluster.local:9050" # FIXME: harcoded
            - name: METRICS_URL
              value: "http://metrics.{{ .Release.Namespace }}.svc.cluster.local:1050" # FIXME: harcoded
            - name: NOTIFICATION_URL
              value: "http://notification.{{ .Release.Namespace }}.svc.cluster.local:2020/"
            - name: SEARCH_URL
              value: "http://search.{{ .Release.Namespace }}.svc.cluster.local:9090/" # FIXME: harcoded
            - name: USER_MANAGEMENT_URL
              value: "http://user-mgnt.{{ .Release.Namespace }}.svc.cluster.local:3030/" # FIXME: hardcoded
            - name: WEBHOOKS_URL
              value: "http://webhooks.{{ .Release.Namespace }}.svc.cluster.local:2525/"
            - name: WORKFLOW_URL
              value: "http://workflow.{{ .Release.Namespace }}.svc.cluster.local:5050/"
            - name: EVENTS_URL
              value: "http://events.{{ .Release.Namespace }}.svc.cluster.local:5555/"
            - name: COUNTRY_CONFIG_URL
              value: http://countryconfig.{{ .Release.Namespace }}.svc.cluster.local:3040
          {{- include "render-env-vars" (dict "service_name" "gateway" "Values" .Values) }}
          ports:
            - containerPort: 7070
              protocol: TCP
          volumeMounts:
            - mountPath: /secrets/public-key.pem
              name: public-key
              subPath: public-key.pem
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: public-key.pem
                path: public-key.pem
            name: public-key
          name: public-key