
{{- if not .Values.dashboards.use_default_credentials }}
{{/* Prevent secret mutation between helm upgrades */}}
{{- $secret_name := "dashboards-admin-user" }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secret_name }}
{{- if not $secret }}
{{- $password := randAlphaNum 32 }}
{{- if $.Values.chart_dev_mode }}
{{- $password = "m3tabase" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret_name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "1"
type: Opaque
data:
  OPENCRVS_METABASE_ADMIN_PASSWORD: {{ $password | b64enc }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboards-metabase-init
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  apm-server.yml: |
{{ .Files.Get "files/metabase.init.db.sql" | indent 4 }}
