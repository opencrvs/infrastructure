# FIXME: Refactor to k8s cronjobs, this is essentially a cron wrapper
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: scheduler
  name: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: "ghcr.io/opencrvs/ocrvs-scheduler:{{ .Values.image.tag }}"
          env:
            - name: METRICS_URL
              value: http://metrics.{{ .Release.Namespace }}.svc.cluster.local:1050 # FIXME: harcoded
            - name: NODE_ENV
              value: development
            - name: OPENHIM_MONGO_URL
              value: mongodb://{{ .Values.mongodb.mongodb_host }}/openhim-dev
          {{- range $k, $v := .Values.scheduler.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
      restartPolicy: Always
