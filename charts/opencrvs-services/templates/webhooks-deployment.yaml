---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: webhooks-route
spec:
  entryPoints:
  {{- if .Values.ingress.ssl_enabled }}
    - websecure
  {{- else }}
    - web
  {{- end }}
  routes:
  - match: 'Host(`webhooks.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: webhooks
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.webhooks.port }}
    middlewares:
      - name: sts-and-basic-response-headers

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: webhooks
  name: webhooks
spec:
  replicas: {{ .Values.webhooks.replicas }}
  selector:
    matchLabels:
      app: webhooks
  template:
    metadata:
      labels:
        app: webhooks
    spec:
      containers:
        - name: webhooks
          image: "ghcr.io/opencrvs/ocrvs-webhooks:{{ .Values.image.tag }}"
          env:
            - name: FHIR_URL
              value: {{ .Values.fhir_url | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis_host | quote }}
            - name: QA_ENV
              value: "false"
            - name: AUTH_URL
              value: http://auth.{{ .Release.Namespace }}.svc.cluster.local:4040
            - name: CERT_PUBLIC_KEY_PATH
              value: /secrets/public-key.pem
            - name: CERT_PRIVATE_KEY_PATH
              value: /secrets/private-key.pem
            - name: CHECK_INVALID_TOKEN
              value: "true"
            - name: HOST
              value: 0.0.0.0
            - name: USER_MANAGEMENT_URL
              value: http://user-mgnt.{{ .Release.Namespace }}.svc.cluster.local:3030/
            - name: MONGO_URL
              value: mongodb://{{ .Values.mongodb_host }}/webhooks
          {{- include "render-env-vars" (dict "service_name" "webhooks" "Values" .Values) }}
          {{ include "resources-helper" (dict "service_name" "webhooks" "Values" .Values) | indent 10 }}
          ports:
            - containerPort: {{ .Values.webhooks.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping # FIXME: not real healthz, just checking if http server is up x
              port: {{ .Values.webhooks.port }}
          readinessProbe:
            httpGet:
              path: /ping # FIXME: not real healthz, just checking if http server is up
              port: {{ .Values.webhooks.port }}
          volumeMounts:
            - mountPath: /secrets/public-key.pem
              name: public-key
              subPath: public-key.pem
            - mountPath: /secrets/private-key.pem
              name: private-key
              subPath: private-key.pem
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: public-key.pem
                path: public-key.pem
            name: {{ .Release.Name }}-cert-tls
          name: public-key
        - secret:
            secretName: {{ .Release.Name }}-key-tls
          name: private-key

{{- include "service-helper" (dict "service_name" "webhooks" "Values" .Values) }}

{{- include "hpa-helper" (dict "service_name" "webhooks" "Values" .Values) }}

{{- include "pdb-helper" (dict "service_name" "webhooks" "Values" .Values) }}
