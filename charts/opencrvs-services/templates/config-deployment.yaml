apiVersion: v1
kind: Service
metadata:
  labels:
    app: config
  name: config
spec:
  ports:
    - port: {{ .Values.config.container_port }}
      targetPort: {{ .Values.config.container_port }}
  selector:
    app: config
  type: LoadBalancer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: config-route
spec:
  entryPoints:
    - websecure
  routes:
  - match: 'Host(`config.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: config
      namespace: opencrvs-services-dev
      port: {{ .Values.config.container_port }}
    middlewares:
      - name: sts-and-basic-response-headers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: config
  name: config
spec:
  replicas: {{ .Values.config.replicas }}
  selector:
    matchLabels:
      app: config
  template:
    metadata:
      labels:
        app: config
    spec:
      containers:
        - name: config
          image: "ghcr.io/opencrvs/ocrvs-config:{{ .Values.image.tag }}"
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := .Values.config.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: PORT
              value: "{{ .Values.config.container_port }}"
            - name: CERT_PUBLIC_KEY_PATH
              value: /secrets/public-key.pem
          ports:
            - containerPort: {{ .Values.config.container_port }}
              protocol: TCP
          volumeMounts:
            - mountPath: /secrets/public-key.pem
              name: public-key
              subPath: public-key.pem
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: public-key.pem
                path: public-key.pem
            name: public-key
          name: public-key