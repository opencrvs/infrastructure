---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: config-route
spec:
  entryPoints:
  {{- if .Values.ingress.ssl_enabled }}
    - websecure
  {{- else }}
    - web
  {{- end }}
  routes:
  - match: 'Host(`config.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: config
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.config.port }}
    middlewares:
      - name: sts-and-basic-response-headers

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: config
  name: config
spec:
  replicas: {{ .Values.config.replicas }}
  selector:
    matchLabels:
      app: config
  template:
    metadata:
      labels:
        app: config
    spec:
      containers:
        - name: config
          image: "ghcr.io/opencrvs/ocrvs-config:{{ .Values.image.tag }}"
          env:
            - name: CERT_PUBLIC_KEY_PATH
              value: /secrets/public-key.pem
            - name: FHIR_URL
              value: {{ .Values.fhir_url | quote }}
            - name: CLIENT_APP_URL
              value: {{ include "render-external-url" (dict "service_name" "register" "Values" .Values) }}
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "{{ .Values.config.port }}"
            - name: AUTH_URL
              value: "http://auth.{{ .Release.Namespace }}.svc.cluster.local:4040"
            - name: COUNTRY_CONFIG_URL
              value: http://countryconfig.{{ .Release.Namespace }}.svc.cluster.local:3040
            - name: COUNTRY_CONFIG_URL_INTERNAL
              value: http://countryconfig.{{ .Release.Namespace }}.svc.cluster.local:3040
            - name: DOCUMENTS_URL
              value: http://documents.{{ .Release.Namespace }}.svc.cluster.local:9050
            - name: METRICS_URL
              value: http://metrics.{{ .Release.Namespace }}.svc.cluster.local:1050
            - name: SEARCH_URL
              value: http://search.{{ .Release.Namespace }}.svc.cluster.local:9090/    
            - name: USER_MANAGEMENT_URL
              value: http://user-mgnt.{{ .Release.Namespace }}.svc.cluster.local:3030/
          {{- if .Values.mongodb_noauth }}     
            - name: HEARTH_MONGO_URL
              value: "mongodb://{{ .Values.mongodb_host }}/hearth-dev"
            - name: MONGO_URL
              value: mongodb://{{ .Values.mongodb_host }}/application-config
          {{- end }}
          {{- include "render-env-vars" (dict "service_name" "config" "Values" .Values) }}
          {{ include "resources-helper" (dict "service_name" "config" "Values" .Values) | indent 10 }}
          ports:
            - containerPort: {{ .Values.config.port }}
              protocol: TCP
          # TODO: Implement liveness and readiness probes
          volumeMounts:
            - mountPath: /secrets/public-key.pem
              name: public-key
              subPath: public-key.pem
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: public-key.pem
                path: public-key.pem
            name: {{ .Release.Name }}-cert-tls
          name: public-key

{{- include "service-helper" (dict "service_name" "config" "Values" .Values) }}

{{- include "hpa-helper" (dict "service_name" "config" "Values" .Values) }}

{{- include "pdb-helper" (dict "service_name" "config" "Values" .Values) }}
