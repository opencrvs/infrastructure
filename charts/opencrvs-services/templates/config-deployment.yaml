apiVersion: v1
kind: Service
metadata:
  labels:
    app: config
  name: config
spec:
  ports:
    - port: 2021
      targetPort: 2021
  selector:
    app: config
  type: LoadBalancer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: config-route
spec:
  entryPoints:
    - websecure
  routes:
  - match: 'Host(`config.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: config
      namespace: opencrvs-services-dev
      port: 2021
    middlewares:
      - name: sts-and-basic-response-headers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: config
  name: config
spec:
  replicas: {{ .Values.config.replicas }}
  selector:
    matchLabels:
      app: config
  template:
    metadata:
      labels:
        app: config
    spec:
      containers:
        - name: config
          image: "ghcr.io/opencrvs/ocrvs-config:{{ .Values.image.tag }}"
          env:
            - name: FHIR_URL
              value: {{ .Values.fhir_url | quote }}
            - name: CLIENT_APP_URL
              value: "https://register.{{ .Values.hostname }}"
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "2021"
          {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
          {{- range $k, $v := .Values.config.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
            - name: CERT_PUBLIC_KEY_PATH
              value: /secrets/public-key.pem
          ports:
            - containerPort: 2021
              protocol: TCP
          volumeMounts:
            - mountPath: /secrets/public-key.pem
              name: public-key
              subPath: public-key.pem
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: public-key.pem
                path: public-key.pem
            name: public-key
          name: public-key