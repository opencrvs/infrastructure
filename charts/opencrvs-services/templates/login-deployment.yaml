apiVersion: v1
kind: Service
metadata:
  labels:
    app: login
  name: login
spec:
  ports:
    - port: 3020
      targetPort: 80
  selector:
    app: login
  type: LoadBalancer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: login-route
spec:
  entryPoints:
    - websecure
  routes:
  - match: 'Host(`login.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: login
      namespace: {{ .Release.Namespace }}
      port: 3020
    middlewares:
      - name: sts-and-basic-response-headers
      - name: enable-compression
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: login
  name: login
spec:
  replicas: {{ .Values.login.replicas }}
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      containers:
        - name: login
          image: "ghcr.io/opencrvs/ocrvs-login:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80 #FIXME: non-low end port
              protocol: TCP
          env:
            - name: CONTENT_SECURITY_POLICY_WILDCARD
              value: "*.{{ .Values.hostname }}"
            - name: COUNTRY_CONFIG_URL_INTERNAL
              value: http://countryconfig.{{ .Release.Namespace }}.svc.cluster.local:3040
          {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
          {{- range $k, $v := .Values.login.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
      restartPolicy: Always
