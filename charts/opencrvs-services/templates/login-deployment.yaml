apiVersion: v1
kind: Service
metadata:
  labels:
    app: login
  name: login
spec:
  ports:
    - port: 3020
      targetPort: 80
  selector:
    app: login
  type: {{ .Values.service_type }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: login-route
spec:
  entryPoints:
    - websecure
  routes:
  - match: 'Host(`login.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: login
      namespace: {{ .Release.Namespace }}
      port: 3020
    middlewares:
      - name: sts-and-basic-response-headers
      # - name: enable-compression
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: login
  name: login
spec:
  replicas: {{ .Values.login.replicas }}
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      containers:
        - name: login
          image: "ghcr.io/opencrvs/ocrvs-login:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              # /api/countryconfig/login-config.js is external service proxied by nginx
              # pod should be restarted once countryconfig is up
              path: /api/countryconfig/login-config.js
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            - name: CONTENT_SECURITY_POLICY_WILDCARD
              value: "*.{{ .Values.hostname }}"
            - name: COUNTRY_CONFIG_URL_INTERNAL
              value: http://countryconfig.{{ .Release.Namespace }}.svc.cluster.local:3040
          {{- include "render-env-vars" (dict "service_name" "login" "Values" .Values) }}
      restartPolicy: Always
