apiVersion: v1
kind: Service
metadata:
  labels:
    app: user-mgnt
  name: user-mgnt
spec:
  ports:
    - port: 3030
      targetPort: 3030
  selector:
    app: user-mgnt
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: user-mgnt
  name: user-mgnt
spec:
  replicas: {{ .Values.userMgnt.replicas }}
  selector:
    matchLabels:
      app: user-mgnt
  template:
    metadata:
      labels:
        app: user-mgnt
    spec:
      containers:
        - name: user-mgnt
          image: "ghcr.io/opencrvs/ocrvs-user-mgnt:{{ .Values.image.tag }}"
          env:
            - name: FHIR_URL
              value: {{ .Values.fhir_url | quote }}
            - name: APPLICATION_CONFIG_URL
              value: http://config.{{ .Release.Namespace }}.svc.cluster.local:2021
            - name: CERT_PUBLIC_KEY_PATH
              value: /secrets/public-key.pem
            - name: HOST
              value: 0.0.0.0
            - name: METRICS_URL
              value: http://metrics.{{ .Release.Namespace }}.svc.cluster.local:1050
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification.{{ .Release.Namespace }}.svc.cluster.local:2020/
            - name: DOCUMENTS_URL
              value: http://documents.{{ .Release.Namespace }}.svc.cluster.local:9050
          {{- range $k, $v := .Values.userMgnt.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
          ports:
            - containerPort: 3030
              protocol: TCP
          volumeMounts:
            - mountPath: /secrets/public-key.pem
              name: public-key
              subPath: public-key.pem
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: public-key.pem
                path: public-key.pem
            name: public-key
          name: public-key