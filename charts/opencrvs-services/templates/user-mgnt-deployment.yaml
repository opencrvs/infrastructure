apiVersion: v1
kind: Service
metadata:
  labels:
    app: user-mgnt
  name: user-mgnt
spec:
  ports:
    - port: 3030
      targetPort: 3030
  selector:
    app: user-mgnt
  type: {{ .Values.service_type }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: user-mgnt
  name: user-mgnt
spec:
  replicas: {{ .Values.userMgnt.replicas }}
  selector:
    matchLabels:
      app: user-mgnt
  template:
    metadata:
      labels:
        app: user-mgnt
    spec:
      containers:
        - name: user-mgnt
          image: "ghcr.io/opencrvs/ocrvs-user-mgnt:{{ .Values.image.tag }}"
          env:
            - name: FHIR_URL
              value: {{ .Values.fhir_url | quote }}
            - name: APPLICATION_CONFIG_URL
              value: http://config.{{ .Release.Namespace }}.svc.cluster.local:2021
            - name: CERT_PUBLIC_KEY_PATH
              value: /secrets/public-key.pem
            - name: HOST
              value: 0.0.0.0
            - name: METRICS_URL
              value: http://metrics.{{ .Release.Namespace }}.svc.cluster.local:1050
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification.{{ .Release.Namespace }}.svc.cluster.local:2020/
            - name: DOCUMENTS_URL
              value: http://documents.{{ .Release.Namespace }}.svc.cluster.local:9050
            - name: MONGO_URL
              value: mongodb://{{ .Values.mongodb_host }}/user-mgnt
            - name: COUNTRY_CONFIG_URL
              value: {{ include "render-external-url" (dict "service_name" "countryconfig" "Values" .Values) }}
          {{- include "render-env-vars" (dict "service_name" "userMgnt" "Values" .Values) }}
          ports:
            - containerPort: 3030
              protocol: TCP
          volumeMounts:
            - mountPath: /secrets/public-key.pem
              name: public-key
              subPath: public-key.pem
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: public-key.pem
                path: public-key.pem
            name: {{ .Release.Name }}-cert-tls
          name: public-key