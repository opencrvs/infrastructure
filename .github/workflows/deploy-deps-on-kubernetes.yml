name: Deploy Dependencies
run-name: Deploy Dependencies on ${{ inputs.environment }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - production
          - development
          - staging
          - dev
          - backup
          - jump
          - qa
jobs:
  deploy:
    env:
      ENV: ${{ inputs.environment }}
    runs-on:
      - self-hosted
      - k8s
      - ${{ inputs.environment }}
    steps:
      - name: Install traefik
        run: |
          helm upgrade --install traefik oci://ghcr.io/traefik/helm/traefik \
            --namespace traefik \
            --create-namespace \
            -f https://raw.githubusercontent.com/opencrvs/infrastructure/refs/heads/develop/examples/${ENV}/traefik/values.yaml
      - name: Install OpenCRVS dependencies
        run: |
          helm upgrade --install opencrvs-deps oci://ghcr.io/opencrvs/opencrvs-dependencies-chart \
            --namespace "opencrvs-deps-${ENV}" \
            -f https://raw.githubusercontent.com/opencrvs/infrastructure/refs/heads/develop/examples/${ENV}/dependencies/values.yaml \
            --create-namespace \
            --set storage_type=host_path \
            --atomic
