name: Sync GitHub Secrets to Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - demo
  push:
    paths:
      - ".github/secret-mapping.yaml"

jobs:
  sync-secrets:
    runs-on:
      - self-hosted
      - k8s
      - ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Apply secrets from mapping
        env:
          # Export all GitHub secrets into environment variables
          # (careful: don’t echo them to logs!)
          $(printf "%s " $(yq '.[].[]' .github/secret-mapping.yaml | sort -u)): ""
        run: |
          set -euo pipefail

          mapping_file=".github/secret-mapping.yaml"

          # Loop over each Kubernetes secret name
          for secret in $(yq 'keys | .[]' $mapping_file); do
            echo "Processing secret: $secret"

            tmpfile=$(mktemp)
            echo "apiVersion: v1" > $tmpfile
            echo "kind: Secret" >> $tmpfile
            echo "metadata:" >> $tmpfile
            echo "  name: $secret" >> $tmpfile
            echo "  namespace: default" >> $tmpfile
            echo "type: Opaque" >> $tmpfile
            echo "stringData:" >> $tmpfile

            # Loop over GitHub secrets mapped to this K8s secret
            for gh_secret in $(yq ".\"$secret\"[]" $mapping_file); do
              gh_secret=$(echo $gh_secret | tr -d '"')
              value="${{ secrets[format('{0}', 'DUMMY')] }}" # placeholder
            done
