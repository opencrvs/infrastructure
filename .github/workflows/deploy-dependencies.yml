name: 02. Deploy Dependencies
run-name: Deploy Dependencies on ${{ inputs.environment }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "development"
        type: choice
        options:
          - perftest
env:
  DEPENDENCIES_CHART_VERSION: "v2.1.0"
  TRAEFIK_CHART_VERSION: "41.0.2"
jobs:
  approve:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Waiting for manual approval
        if: ${{ (vars.APPROVAL_REQUIRED || 'false') == 'true' }}
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ vars.GH_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Deploy dependencies (${{ inputs.environment }})"
          issue-body: >
            Please approve or deny the OpenCRVS dependencies deployment to ${{ inputs.environment }}
            initiated from GitHub Actions by @${{ github.actor }}.
          exclude-workflow-initiator-as-approver: false

  github-to-k8s-sync-env:
    needs: approve
    uses: ./.github/workflows/github-to-k8s-sync-env.yml
    with:
      environment: ${{ inputs.environment }}
      namespace_template: "opencrvs-deps"
    secrets: inherit

  deploy:
    needs: 'github-to-k8s-sync-env'
    environment: ${{ inputs.environment }}
    runs-on:
      - self-hosted
      - k8s
      - ${{ inputs.environment }}
    env:
      ENV: ${{ inputs.environment }}
      GITHUB_ACTOR: ${{ github.actor }}
      SENDER_EMAIL_ADDRESS: ${{ secrets.SENDER_EMAIL_ADDRESS }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Traefik
        run: |
          touch environments/${ENV}/traefik/values.override.yaml
          kubectl scale deployment traefik --replicas=0 --namespace traefik || true
          helm upgrade --install traefik oci://ghcr.io/traefik/helm/traefik:${TRAEFIK_CHART_VERSION} \
            --namespace traefik \
            --create-namespace \
            -f environments/${ENV}/traefik/values.yaml \
            -f environments/${ENV}/traefik/values.override.yaml
          kubectl scale deployment traefik --replicas=1 --namespace traefik || true
      - name: Apply custom ILM configmaps
        # Namespace must exist first; helm doesn't create it until later in this job.
        run: |
          kubectl create namespace "opencrvs-deps-${ENV}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap filebeat-ilm-config-perftest \
            --namespace "opencrvs-deps-${ENV}" \
            --from-file=filebeat-rollover-policy.json=environments/${ENV}/dependencies/configmaps/filebeat-rollover-policy.json \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap metricbeat-ilm-config-perftest \
            --namespace "opencrvs-deps-${ENV}" \
            --from-file=metricbeat-rollover-policy.json=environments/${ENV}/dependencies/configmaps/metricbeat-rollover-policy.json \
            --dry-run=client -o yaml | kubectl apply -f -
      # FIXME: remove BACKUP_HOST/RESTORE_HOST after v2.2
      # See: https://github.com/opencrvs/opencrvs-core/pull/13502
      - name: Install OpenCRVS dependencies
        id: deploy
        run: |
          stern -n "opencrvs-deps-${ENV}" \
            --since 1s \
            --tail 0 \
            --exclude 'kube-probe' \
            --exclude '"level":(30|info)' \
            --template '{{.PodName}}/{{.ContainerName}} | {{.Message}}{{"\n"}}' \
            . &
          STERN_PID=$!
          touch environments/${ENV}/dependencies/values.override.yaml
          helm upgrade --install opencrvs-deps oci://ghcr.io/opencrvs/opencrvs-dependencies-chart:${DEPENDENCIES_CHART_VERSION} \
            --namespace "opencrvs-deps-${ENV}" \
            -f environments/${ENV}/dependencies/values.yaml \
            -f environments/${ENV}/dependencies/values.override.yaml \
            --set backup.host=${{ vars.BACKUP_HOST }} \
            --set restore.host=${{ vars.RESTORE_HOST }} \
            --create-namespace \
            --timeout 15m \
            --set hostname=${{ vars.DOMAIN }} \
            --atomic; STATUS=$?;

          kill $STERN_PID 2>/dev/null || true
          exit $STATUS
      - name: Tighten built-in APM ILM policies
        # apm-server's own ilm.setup config is inert; Elasticsearch's built-in
        # *-apm@template policies actually govern retention, so those are edited directly.
        run: |
          NAMESPACE="opencrvs-deps-${ENV}"
          ELASTIC_PASSWORD=$(kubectl get secret elasticsearch-admin-user -n "$NAMESPACE" -o jsonpath='{.data.ELASTIC_PASSWORD}' | base64 -d)
          while read -r policy; do
            [ -z "$policy" ] && continue
            echo "Updating ILM policy: ${policy}"
            status=$(kubectl exec -i -n "$NAMESPACE" elasticsearch-0 -- curl -s -o /dev/null -w '%{http_code}' \
              -u "elastic:${ELASTIC_PASSWORD}" \
              -X PUT "localhost:9200/_ilm/policy/${policy}" \
              -H 'Content-Type: application/json' \
              --data-binary @- < environments/${ENV}/dependencies/configmaps/apm-ilm-policy.json)
            if [ "$status" != "200" ]; then
              echo "  ERROR: unexpected status ${status} updating ${policy}" >&2
              exit 1
            fi
          done < environments/${ENV}/dependencies/configmaps/apm-ilm-policy-names.txt
      - name: Set up k6-metrics rollover + retention
        # xk6-output-elasticsearch has no retention of its own; this turns
        # k6-metrics into a rollover alias so it expires like the other indices.
        run: |
          NAMESPACE="opencrvs-deps-${ENV}"
          ELASTIC_PASSWORD=$(kubectl get secret elasticsearch-admin-user -n "$NAMESPACE" -o jsonpath='{.data.ELASTIC_PASSWORD}' | base64 -d)

          echo "Applying k6-metrics ILM policy..."
          status=$(kubectl exec -i -n "$NAMESPACE" elasticsearch-0 -- curl -s -o /dev/null -w '%{http_code}' \
            -u "elastic:${ELASTIC_PASSWORD}" \
            -X PUT "localhost:9200/_ilm/policy/k6-metrics-rollover-policy" \
            -H 'Content-Type: application/json' \
            --data-binary @- < environments/${ENV}/dependencies/configmaps/k6-metrics-ilm-policy.json)
          if [ "$status" != "200" ]; then
            echo "ERROR: unexpected status ${status} applying k6-metrics ILM policy" >&2
            exit 1
          fi

          echo "Applying k6-metrics index template..."
          status=$(kubectl exec -i -n "$NAMESPACE" elasticsearch-0 -- curl -s -o /dev/null -w '%{http_code}' \
            -u "elastic:${ELASTIC_PASSWORD}" \
            -X PUT "localhost:9200/_index_template/k6-metrics-template" \
            -H 'Content-Type: application/json' \
            --data-binary @- < environments/${ENV}/dependencies/configmaps/k6-metrics-index-template.json)
          if [ "$status" != "200" ]; then
            echo "ERROR: unexpected status ${status} applying k6-metrics index template" >&2
            exit 1
          fi

          echo "Checking whether the k6-metrics rollover alias already exists..."
          ALIAS_STATUS=$(kubectl exec -i -n "$NAMESPACE" elasticsearch-0 -- curl -s -o /dev/null -w '%{http_code}' \
            -u "elastic:${ELASTIC_PASSWORD}" "localhost:9200/_alias/k6-metrics")
          if [ "$ALIAS_STATUS" == "200" ]; then
            echo "k6-metrics is already a rollover alias, nothing to bootstrap."
          else
            INDEX_STATUS=$(kubectl exec -i -n "$NAMESPACE" elasticsearch-0 -- curl -s -o /dev/null -w '%{http_code}' \
              -u "elastic:${ELASTIC_PASSWORD}" -X HEAD "localhost:9200/k6-metrics")
            if [ "$INDEX_STATUS" == "200" ]; then
              # Plain index collides with the alias name; dropped rather than migrated (disposable load-test data).
              echo "k6-metrics exists as a plain index; deleting it so the alias can take its name"
              kubectl exec -i -n "$NAMESPACE" elasticsearch-0 -- curl -s -u "elastic:${ELASTIC_PASSWORD}" \
                -X DELETE "localhost:9200/k6-metrics" > /dev/null
            fi
            echo "Bootstrapping k6-metrics-000001 as the write index behind the k6-metrics alias..."
            status=$(kubectl exec -i -n "$NAMESPACE" elasticsearch-0 -- curl -s -o /dev/null -w '%{http_code}' \
              -u "elastic:${ELASTIC_PASSWORD}" \
              -X PUT "localhost:9200/k6-metrics-000001" \
              -H 'Content-Type: application/json' \
              -d '{"aliases": {"k6-metrics": {"is_write_index": true}}}')
            if [ "$status" != "200" ]; then
              echo "ERROR: unexpected status ${status} bootstrapping k6-metrics-000001" >&2
              exit 1
            fi
          fi
      # FIXME: Implement vars.MONITORING_ENABLED check to conditionally install OpenTelemetry Collector
      # https://github.com/opencrvs/opencrvs-core/issues/13377
      - name: Install OpenTelemetry Collector
        run: |
          [ ! -f environments/${ENV}/opentelemetry/values.yaml ] && echo "No OpenTelemetry values.yaml found for environment ${ENV}, skipping installation" && exit 0
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts || true
          touch environments/${ENV}/opentelemetry/values.override.yaml
          helm upgrade --install opentelemetry-collector open-telemetry/opentelemetry-collector \
            --namespace traefik \
            --create-namespace \
            --namespace "opencrvs-deps-${ENV}" \
            --set image.repository="otel/opentelemetry-collector-k8s" \
            --set mode=deployment \
            -f environments/${ENV}/opentelemetry/values.yaml \
            -f environments/${ENV}/opentelemetry/values.override.yaml

      - name: Cleanup Helm Locks
        if: failure() || cancelled()
        run: |
          kubectl -n "opencrvs-deps-${ENV}" get secrets -l owner=helm -o json | \
          jq -r '.items[] | select(.metadata.labels.status=="pending-install" or .metadata.labels.status=="pending-upgrade" or .metadata.labels.status=="pending-rollback") | .metadata.name' | \
          xargs -r kubectl -n "opencrvs-deps-${ENV}" delete secret || \
          echo "No helm locks found, all is good"

      - name: Send email
        if: always()
        run: |
          subject="🚀 OpenCRVS dependencies deployment to '$ENV' completed successfully"
          if [ "${{ steps.deploy.outcome }}" == 'failure' ]; then
            subject="⚠️ OpenCRVS deployment to '$ENV' has failed"
          fi
          EMAIL_PAYLOAD="{
            \"subject\": \"$subject\",
            \"html\": \"${subject}<br/>Deployed by GitHub user: @${GITHUB_ACTOR}\",
            \"from\": \"${SENDER_EMAIL_ADDRESS}\",
            \"to\": \"${ALERT_EMAIL}\"
          }"

          curl -X POST http://countryconfig.opencrvs-$ENV.svc.cluster.local:3040/email \
               -H 'Content-Type: application/json' \
               -d "$EMAIL_PAYLOAD" \
               --connect-timeout 5 \
               --max-time 10 \
               --fail \
               --silent \
               --show-error || echo "Error: Failed to reach countryconfig service"
